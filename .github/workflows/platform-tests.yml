name: Platform tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} (${{ matrix.cc }}, Nim ${{ matrix.nimversion }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc, nimversion: '2.2.10'}
          - {os: ubuntu-latest, cc: clang, nimversion: '2.2.10'}
          - {os: macos-latest, cc: clang, nimversion: '2.2.10'}
          - {os: windows-latest, cc: gcc, nimversion: '2.2.10'}
    steps:
      - uses: actions/checkout@v4

      - uses: iffy/install-nim@v4
        if: runner.os != 'Windows'
        with:
          version: ${{ matrix.nimversion }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nim on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NIM_VERSION: ${{ matrix.nimversion }}
        run: |
          $archive = "$env:RUNNER_TEMP\nim.zip"
          Invoke-WebRequest "https://nim-lang.org/download/nim-${env:NIM_VERSION}_x64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP\nim"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\nim\nim-$env:NIM_VERSION\bin"

      - name: Install Linux C compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }}
          ${{ matrix.cc }} --version

      - name: Install Windows compiler and TLS libraries
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl

      - name: Add Windows tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content $env:GITHUB_PATH "$env:MSYS2_LOCATION\mingw64\bin"

      - name: Check out Atlas
        uses: actions/checkout@v4
        with:
          repository: nim-lang/atlas
          # Same Atlas revision used for local validation; includes atlas-run.
          ref: 6d6d24c25a466cc19b4230be0e18200ef663b210
          path: .ci/atlas

      - name: Build Atlas
        working-directory: .ci/atlas
        run: |
          nim installSat
          mkdir -p bin
          nim c -d:release --cc:${{ matrix.cc }} --out:bin/atlas src/atlas.nim
          nim c -d:release --cc:${{ matrix.cc }} --out:bin/atlas-run src/atlasrun.nim
          echo "$GITHUB_WORKSPACE/.ci/atlas/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          atlas init
          atlas --feature=chronos install

      - name: Run tests including Chronos
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Nim's Windows selector backend has no native timer support.
            atlas-run tests --jobs:2 --only-errors --skip tests/tslotsThreadSelectors.nim -- -d:features.sigils.chronos --cc:${{ matrix.cc }}
          else
            atlas-run tests --jobs:2 --only-errors -- -d:features.sigils.chronos --cc:${{ matrix.cc }}
          fi
